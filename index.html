<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S'identifier</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- Partie gauche : formulaire de connexion -->
    <div class="form-container">
      <form action="#" method="post">
        <h1>S'identifier</h1>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <a href="#" class="forgot">Mot de passe oublier</a>
        <button type="submit" class="btn-main">S'identifier</button>
      </form>
    </div>

    <!-- Partie droite : invitation à s'inscrire -->
    <div class="overlay-container">
      <h1>Salut l'ami!</h1>
      <p>Entrez vos données personnelles et commencez votre voyage avec nous</p>
      <a href="#" class="btn-ghost">S'inscrire</a>
    </div>

  </div>

</body>
</html>
